services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/platform.db
      INFERENCE_BASE_URL: http://inference:8010
    volumes:
      - platform-data:/data
    depends_on:
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  inference:
    build:
      context: .
      dockerfile: services/inference/Dockerfile
    env_file: .env
    environment:
      INFERENCE_MODE: ${INFERENCE_MODE:-demo}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    profiles: ["cloudflare"]
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  platform-data:
